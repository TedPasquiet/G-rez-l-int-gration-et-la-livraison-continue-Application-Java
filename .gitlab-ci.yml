# =============================================================================
# Back-end (Java / Spring Boot) pipeline.
# The generic test/release skeleton lives in the shared ci-templates project;
# here we only override images and add the Java-specific build/docker stages.
# =============================================================================
include:
  - project: 'pasquietted/ci-templates'   # dépôt qui contient ci-template.yml
    ref: main
    file: '/ci-template.yml'

# ---------------------------------------------------------------------------
# Tests: JDK 21 image, test.sh drives Gradle.
# ---------------------------------------------------------------------------
test:
  extends: .test
  image: eclipse-temurin:21

# ---------------------------------------------------------------------------
# Release: semantic-release runs ./gradlew ... publish, so the Node release
# image also needs a JDK. node:20-bookworm (Debian 12) has no openjdk-21
# package, so install Temurin 21 from Adoptium, then run the shared
# semantic-release setup (referenced from the template).
# ---------------------------------------------------------------------------
release:
  extends: .release
  before_script:
    - apt-get update && apt-get install -y wget apt-transport-https gnupg
    - mkdir -p /etc/apt/keyrings
    - wget -qO - https://packages.adoptium.net/artifactory/api/gpg/key/public | gpg --dearmor -o /etc/apt/keyrings/adoptium.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb bookworm main" > /etc/apt/sources.list.d/adoptium.list
    - apt-get update && apt-get install -y temurin-21-jdk
    - !reference [.release, before_script]

# ---------------------------------------------------------------------------
# Build the Spring Boot WAR for the tag semantic-release just created, and
# explode it into build/dependency so the Dockerfile can consume it.
# ---------------------------------------------------------------------------
build:war:
  stage: build
  image: eclipse-temurin:21
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - chmod +x ./gradlew
    # Strip the leading "v" so the artifact carries the bare version
    - ./gradlew -PreleaseVersion=${CI_COMMIT_TAG#v} clean bootWar
    - mkdir -p build/dependency
    - (cd build/dependency; jar -xf ../libs/*.war)
  artifacts:
    paths:
      - build/dependency
    expire_in: 1 hour

# ---------------------------------------------------------------------------
# Build the container image from the exploded WAR and push it to the GitLab
# Container Registry, tagged with the release version and "latest".
# ---------------------------------------------------------------------------
docker:push:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - build:war
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - docker build -t "$CI_REGISTRY_IMAGE:$VERSION" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE:latest"
