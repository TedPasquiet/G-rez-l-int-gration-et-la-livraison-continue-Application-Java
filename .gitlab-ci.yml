stages:
  - test
  - release
  - build
  - docker

# ---------------------------------------------------------------------------
# Run the Java tests and expose JUnit reports in the GitLab UI
# ---------------------------------------------------------------------------
test:
  stage: test
  image: eclipse-temurin:21
  script:
    - chmod +x ./gradlew test.sh
    - ./test.sh
  artifacts:
    when: always
    reports:
      junit: test-results/*.xml
    paths:
      - test-results/
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Automatically version, tag, build, publish and create a GitLab release.
# Only runs on the main branch, after tests pass.
# Requires CI/CD variables:
#   GITLAB_TOKEN      -> a project/group access token with api + write_repository
#   GITLAB_PROJECT_ID -> used by the maven-publish block in build.gradle
#   GITLAB_TOKEN_NAME -> header name expected by the Maven registry
# ---------------------------------------------------------------------------
release:
  stage: release
  image: node:20-bookworm
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    # semantic-release runs ./gradlew, so the JDK must be present in this image.
    # node:20-bookworm (Debian 12) has no openjdk-21 package, so pull Temurin 21
    # from the Adoptium APT repo to match the JDK used in the other jobs.
    - apt-get update && apt-get install -y wget apt-transport-https gnupg
    - mkdir -p /etc/apt/keyrings
    - wget -qO - https://packages.adoptium.net/artifactory/api/gpg/key/public | gpg --dearmor -o /etc/apt/keyrings/adoptium.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb bookworm main" > /etc/apt/sources.list.d/adoptium.list
    - apt-get update && apt-get install -y temurin-21-jdk
    - npm install -g
        semantic-release
        @semantic-release/commit-analyzer
        @semantic-release/release-notes-generator
        @semantic-release/changelog
        @semantic-release/exec
        @semantic-release/gitlab
        @semantic-release/git
  script:
    - npx semantic-release
  variables:
    GL_TOKEN: $GL_TOKEN

# ---------------------------------------------------------------------------
# Build the Spring Boot WAR for the tag semantic-release just created, and
# explode it into build/dependency so the existing Dockerfile can consume it.
# Tag pipelines only (CI_COMMIT_TAG = "v1.2.3").
# ---------------------------------------------------------------------------
build:war:
  stage: build
  image: eclipse-temurin:21
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - chmod +x ./gradlew
    # Strip the leading "v" so the artifact carries the bare version
    - ./gradlew -PreleaseVersion=${CI_COMMIT_TAG#v} clean bootWar
    - mkdir -p build/dependency
    - (cd build/dependency; jar -xf ../libs/*.war)
  artifacts:
    paths:
      - build/dependency
    expire_in: 1 hour

# ---------------------------------------------------------------------------
# Build the container image from the exploded WAR and push it to the GitLab
# Container Registry, tagged with the release version and "latest".
# Uses the built-in CI_REGISTRY* variables — no extra config needed.
# ---------------------------------------------------------------------------
docker:push:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - build:war
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - docker build -t "$CI_REGISTRY_IMAGE:$VERSION" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE:latest"
